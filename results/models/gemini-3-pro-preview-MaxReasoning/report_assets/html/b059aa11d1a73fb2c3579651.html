    const PVIS={"Sun":["ffcc00",0.04],"Mercury":["b0b0b0",0.008],"Venus":["e8c060",0.012],"Earth":["4488ff",0.013],"Moon":["aaaaaa",0.005],"Mars":["dd4422",0.01],"Jupiter":["d4a06a",0.028],"Saturn":["e8d080",0.024],"Uranus":["88ccdd",0.018],"Neptune":["4466cc",0.017]};
    const el=document.getElementById(uid);

    // Scene setup

    // State

    }

    const bodyMeshes={};

    // Create planet spheres
    for(const pn of planetNames){
      const cfg=PVIS[pn]||['888888',0.01];

      const baseR=cfg[1];

      if(pn==='Sun'){
        mat=new THREE.MeshBasicMaterial({color:color});
